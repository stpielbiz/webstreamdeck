name: Build Stream Deck TV app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "native-app/android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Strip spaces/newlines that sneak in when pasting the secret.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Keystore bytes: $(wc -c < "$RUNNER_TEMP/release.jks") (expected 2672)"
            PASS="$(printf '%s' "$KS_PASS" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
            ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n' | sed 's/^ *//;s/ *$//')"
            [ -z "$ALIAS" ] && ALIAS="streamdeck"
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PASS" >/dev/null 2>&1; then
              echo "Saved password secret does not open the keystore; using the keystore's built-in password."
              PASS="streamdeck2026"
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PASS" -alias "$ALIAS" >/dev/null 2>&1; then
              echo "Alias secret not found in keystore; using 'streamdeck'."
              ALIAS="streamdeck"
            fi
            keytool -list -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass "$PASS" -alias "$ALIAS"
            echo "::add-mask::$PASS"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$PASS"
              echo "ANDROID_KEY_PASSWORD=$PASS"
              echo "ANDROID_KEY_ALIAS=$ALIAS"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk stream-deck-tv.apk
          printf '{"versionCode":%s,"versionName":"%s","apkUrl":"https://github.com/${{ github.repository }}/releases/latest/download/stream-deck-tv.apk"}\n' \
            "$VERSION_CODE" "$VERSION_NAME" > update.json

      - uses: actions/upload-artifact@v4
        with:
          name: stream-deck-tv
          path: |
            native-app/android/stream-deck-tv.apk
            native-app/android/update.json

      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-app-v1.0.${{ github.run_number }}
          name: Stream Deck TV app 1.0.${{ github.run_number }}
          make_latest: "true"
          files: |
            native-app/android/stream-deck-tv.apk
            native-app/android/update.json
